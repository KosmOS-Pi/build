name: build-package
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package repo (ex. dpkg-libxisf)"
        required: true
      ref:
        description: "Branch or tag to build"
        default: debian/latest
      repo_dir:
        description: "Repo folder on server"
        default: trixie
      include_dbgsym:
        description: "Publish -dbgsym packages too"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    env:
      PIGEN_REF: kosmos-trixie
      REPO_DIR: ${{ inputs.repo_dir }}
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential devscripts equivs fakeroot gnupg

      - uses: actions/checkout@v7
        with:
          repository: KosmOS-Pi/${{ inputs.package }}
          ref: ${{ inputs.ref }}
          path: src

      # Public keyring and expected fingerprint live in pi-gen (bootstrap files).
      - uses: actions/checkout@v7
        with:
          repository: KosmOS-Pi/pi-gen
          ref: ${{ env.PIGEN_REF }}
          path: pigen
          sparse-checkout: stage2/99-kosmos-setup/files

      - name: KosmOS repositories as source of build dependencies
        run: |
          FILES=pigen/stage2/99-kosmos-setup/files
          EXPECTED=$(tr -d '[:space:]' < "$FILES/kosmos-archive-keyring.fpr")
          ACTUAL=$(gpg --show-keys --with-colons "$FILES/kosmos-bootstrap.pgp" \
                   | awk -F: '$1=="fpr"{print $10; exit}')
          echo "Expected primary fingerprint: $EXPECTED"
          echo "Keyring primary fingerprint:  $ACTUAL"
          [ -n "$EXPECTED" ] && [ "$EXPECTED" = "$ACTUAL" ] \
            || { echo "Keyring fingerprint mismatch"; exit 1; }
          install -m 644 "$FILES/kosmos-bootstrap.pgp" /usr/share/keyrings/kosmos-build-keyring.pgp

          # current: signed, verified with the keyring. testing: unsigned, trusted.
          cat > /etc/apt/sources.list.d/kosmos-build.sources <<EOF
          Types: deb
          URIs: https://deb.kosmos-pi.org/$REPO_DIR/
          Suites: trixie
          Components: main
          Architectures: arm64
          Signed-By: /usr/share/keyrings/kosmos-build-keyring.pgp

          Types: deb
          URIs: https://deb.kosmos-pi.org/$REPO_DIR/
          Suites: trixie-testing
          Components: main
          Architectures: arm64
          Trusted: yes
          EOF
          apt-get update
          apt-cache policy | grep -B1 -A2 deb.kosmos-pi.org || true

      - name: Version from changelog
        if: hashFiles('src/debian/changelog') != ''
        working-directory: src
        run: |
          echo "Version: $(dpkg-parsechangelog -S Version)"
          echo "Distribution: $(dpkg-parsechangelog -S Distribution)"

      - name: Build
        working-directory: src
        env:
          OUT_DIR: ${{ github.workspace }}/out
          SRC_DIR: ${{ github.workspace }}/src
        run: |
          mkdir -p "$OUT_DIR"
          if [ -f debian/ci/build.sh ]; then
            echo "Custom build: debian/ci/build.sh"
            bash debian/ci/build.sh
          else
            mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control
            dpkg-buildpackage -us -uc -b -j"$(nproc)"
            mv ../*.deb "$OUT_DIR"/
          fi
          ls "$OUT_DIR"/*.deb

      - name: KosmOS packages installed as build dependencies
        run: |
          dpkg-query -W -f='${Package} ${Version}\n' \
            | grep -E '\+kosmos-[0-9]+~deb13$|-[0-9]+~deb13$' \
            || echo "None: all build dependencies come from Debian."

      - name: Packages check
        run: |
          for f in out/*.deb; do
            echo "== $f"
            dpkg-deb -I "$f" | grep -E "Package|Version|Depends"
          done
          for lib in $(find src/debian -name '*.so*' -type f 2>/dev/null); do
            echo "== NEEDED di $lib"
            readelf -d "$lib" 2> /dev/null | grep NEEDED || echo "Not a shared lib."
          done

      - uses: actions/upload-artifact@v7
        with:
          name: debs-${{ inputs.package }}
          path: out/*.deb

  publish:
    needs: build
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    concurrency:
      group: kosmos-repo
      cancel-in-progress: false
    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_USER: ${{ secrets.SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
      REPO_DIR: ${{ inputs.repo_dir }}
      CODENAME: trixie-testing
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            reprepro lftp openssh-client ca-certificates
          reprepro --version

      - uses: actions/download-artifact@v8
        with:
          name: debs-${{ inputs.package }}
          path: debs

      - name: Packages check
        run: |
          if [ "${{ inputs.include_dbgsym }}" != "true" ]; then
            rm -f debs/*-dbgsym_*.deb
          fi
          ls debs/*.deb
          for deb in debs/*.deb; do
            name=$(dpkg-deb -f "$deb" Package)
            ver=$(dpkg-deb -f "$deb" Version)
            case "$name" in
              kosmos-*) re='-[0-9]+~deb13$' ;;
              *)        re='\+kosmos-[0-9]+~deb13$' ;;
            esac
            echo "$ver" | grep -Eq -- "$re" \
              || { echo "Invalid version: $name $ver (expected: $re)"; exit 1; }
          done

      - name: Download conf, db and dists from testing
        run: |
          mkdir -p /root/.ssh work
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > /root/.ssh/known_hosts
          test -s /root/.ssh/known_hosts || { echo "SFTP_KNOWN_HOSTS is empty"; exit 1; }
          lftp -u "$SFTP_USER,$SFTP_PASSWORD" "sftp://$SFTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 20
          mirror --parallel=1 "$REPO_DIR/conf" work/conf
          mirror --parallel=1 "$REPO_DIR/db" work/db
          mirror --parallel=1 "$REPO_DIR/dists/$CODENAME" "work/dists/$CODENAME"
          bye
          EOF

      - name: DB backup
        uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ github.run_id }}
          path: work/db
          retention-days: 14

      - name: Included packages
        id: inc
        run: |
          cd work
          mkdir -p pool
          added=false
          for deb in ../debs/*.deb; do
            name=$(dpkg-deb -f "$deb" Package)
            ver=$(dpkg-deb -f "$deb" Version)
            cur=$(reprepro -b . list "$CODENAME" "$name" | cut -d' ' -f3)
            if [ "$cur" = "$ver" ]; then
              echo "skip $name $ver (already there)"
              continue
            fi
            echo "add   $name $ver"
            reprepro -b . --export=never includedeb "$CODENAME" "$deb"
            added=true
          done
          echo "added=$added" >> "$GITHUB_OUTPUT"

      - name: Export testing indexes
        if: steps.inc.outputs.added == 'true'
        run: reprepro -b work export "$CODENAME"

      - name: Upload on server (pool, db, dists, in fixed order)
        if: steps.inc.outputs.added == 'true'
        run: |
          cd work
          lftp -u "$SFTP_USER,$SFTP_PASSWORD" "sftp://$SFTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 20
          mirror -R --only-missing --parallel=1 pool "$REPO_DIR/pool"
          mirror -R --delete --parallel=1 --exclude lockfile db "$REPO_DIR/db"
          mirror -R --delete --parallel=1 "dists/$CODENAME" "$REPO_DIR/dists/$CODENAME"
          bye
          EOF
name: build-package
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package repo (ex. dpkg-libxisf)"
        required: true
      ref:
        description: "Branch or tag to build"
        default: debian/latest

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential devscripts equivs fakeroot

      - uses: actions/checkout@v4
        with:
          repository: KosmOS-Pi/${{ inputs.package }}
          ref: ${{ inputs.ref }}
          path: src

      - name: Version from changelog
        working-directory: src
        run: |
          echo "Version: $(dpkg-parsechangelog -S Version)"
          echo "Distribution: $(dpkg-parsechangelog -S Distribution)"

      - name: Build deps
        working-directory: src
        run: mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control

      - name: Build
        working-directory: src
        run: |
          dpkg-buildpackage -us -uc -b -j"$(nproc)"
          mkdir -p ../out
          mv ../*.deb ../out/

      - name: Packages check
        run: |
          for f in out/*.deb; do
            echo "== $f"
            dpkg-deb -I "$f" | grep -E "Package|Version|Depends"
          done
          for lib in $(find src/debian -name '*.so*' -type f 2>/dev/null); do
            echo "== NEEDED di $lib"
            readelf -d "$lib" | grep NEEDED
          done

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ inputs.package }}
          path: out/*.deb

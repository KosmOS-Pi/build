name: build-image
on:
  workflow_dispatch:
    inputs:
      pigen_ref:
        description: "Branch or tag of KosmOS-Pi/pi-gen"
        default: kosmos-trixie
      release:
        description: "Publish the image as a test pre-release"
        type: boolean
        default: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      TAG: image-test-${{ github.run_number }}
    steps:
      - name: Disk and host info (before)
        run: |
          df -h /
          nproc
          free -h
          lsb_release -ds
          uname -m

      - uses: actions/checkout@v7
        with:
          repository: KosmOS-Pi/pi-gen
          ref: ${{ inputs.pigen_ref }}
          path: pi-gen

      - uses: actions/checkout@v7
        with:
          sparse-checkout: imager
          path: build

      - name: Install dependencies listed in pi-gen/depends
        run: |
          cat pi-gen/depends
          sudo apt-get update -qq
          grep -v '^[[:space:]]*$' pi-gen/depends | sed 's/^.*://' \
            | xargs sudo apt-get install -y -qq --no-install-recommends

      - name: Check debootstrap can build trixie
        run: |
          debootstrap --version
          ls /usr/share/debootstrap/scripts | grep -x trixie || echo "No trixie script in debootstrap"
          dpkg -l debian-archive-keyring | tail -1
          ls -l /usr/share/keyrings | grep -i debian || true

      - name: Show pi-gen config
        run: |
          cat pi-gen/config
          git -C pi-gen log -1 --oneline

      - name: Build image
        working-directory: pi-gen
        run: |
          time sudo ./build.sh -c config

      - name: Disk and result (after)
        if: always()
        run: |
          df -h /
          ls -lh pi-gen/deploy/ || true
          sudo chown -R runner:runner pi-gen/deploy

      - name: Uncompressed Checksums
        id: uncompressed_data
        run: |
          cd pi-gen/deploy
          UNCOMPRESSED_IMG=$(ls *-kosmos-trixie-arm64-lite.img)
          UNCOMPRESSED_SIZE=$(stat -c%s "$UNCOMPRESSED_IMG")
          UNCOMPRESSED_SHA=$(sha256sum "$UNCOMPRESSED_IMG" | awk '{print $1}')
          echo "extract_size=$UNCOMPRESSED_SIZE" | tee -a $GITHUB_OUTPUT
          echo "extract_sha256=$UNCOMPRESSED_SHA" | tee -a $GITHUB_OUTPUT

      - name: Compression and Checksums
        id: compressed_data
        run: |
          cd pi-gen/deploy
          UNCOMPRESSED_IMG=$(ls *-kosmos-trixie-arm64-lite.img)
          echo "Compressing image..."
          xz -T 0 -9 "$UNCOMPRESSED_IMG"
          COMPRESSED_IMG="image_${UNCOMPRESSED_IMG}.xz"
          mv "${UNCOMPRESSED_IMG}.xz" "${COMPRESSED_IMG}"
          COMPRESSED_SIZE=$(stat -c%s "$COMPRESSED_IMG")
          COMPRESSED_SHA=$(sha256sum "$COMPRESSED_IMG" | awk '{print $1}')
          sha256sum *.img.xz | tee SHA256SUMS
          echo "download_file=$COMPRESSED_IMG" | tee -a $GITHUB_OUTPUT
          echo "download_size=$COMPRESSED_SIZE" | tee -a $GITHUB_OUTPUT
          echo "download_sha256=$COMPRESSED_SHA" | tee -a $GITHUB_OUTPUT

      - name: Imager json
        env:
          DOWNLOAD_FILE: ${{ steps.compressed_data.outputs.download_file }}
          DOWNLOAD_SIZE: ${{ steps.compressed_data.outputs.download_size }}
          DOWNLOAD_SHA256: ${{ steps.compressed_data.outputs.download_sha256 }}
          EXTRACT_SIZE: ${{ steps.uncompressed_data.outputs.extract_size }}
          EXTRACT_SHA256: ${{ steps.uncompressed_data.outputs.extract_sha256 }}
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${DOWNLOAD_FILE}"
          jq \
            --arg url "$URL" \
            --arg date "$(date -u +%F)" \
            --arg esha "$EXTRACT_SHA256" \
            --arg dsha "$DOWNLOAD_SHA256" \
            --argjson esize "$EXTRACT_SIZE" \
            --argjson dsize "$DOWNLOAD_SIZE" \
            '.os_list[0] += {
               url: $url,
               release_date: $date,
               extract_size: $esize,
               extract_sha256: $esha,
               image_download_size: $dsize,
               image_download_sha256: $dsha
             }' build/imager/kosmos-template.json > pi-gen/deploy/kosmos.json

          # Fail if something is empty or zero
          jq -e '.os_list[0]
                 | (.url | length > 0)
                 and (.extract_size > 0) and (.image_download_size > 0)
                 and (.extract_sha256 | length == 64)
                 and (.image_download_sha256 | length == 64)' \
            pi-gen/deploy/kosmos.json > /dev/null
          cat pi-gen/deploy/kosmos.json

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pigen-log-${{ github.run_id }}
          path: pi-gen/work/*/build.log
          retention-days: 7

      - name: Publish test pre-release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="image-test-${{ github.run_number }}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Test image $tag" --notes "Test image, not for users." \
            pi-gen/deploy/*.img.xz pi-gen/deploy/SHA256SUMS pi-gen/deploy/kosmos.json